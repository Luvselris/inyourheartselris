<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>inyourheartselris ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --melody-pink: #ff85a2;
      --melody-soft: #ffb3c6;
      --melody-light: #fff0f3;
      --melody-card: rgba(255, 255, 255, 0.95);
      --melody-border: #ffccd5;
      --melody-text: #4a3b3e;
      --melody-muted: #8a7377;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      color: var(--melody-text);
      display: flex;
      justify-content: center;
      padding: 26px 14px 60px;
      position: relative;
      background: radial-gradient(circle at top, #ffe5ec 0%, #fff0f3 50%, #ffd6e0 100%);
      overflow-x: hidden;
    }

    /* Pop-up การ์ดต้อนรับเพื่อให้เพลงเล่นทันที 100% */
    .enter-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 229, 236, 0.96);
      backdrop-filter: blur(10px);
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .enter-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .enter-box {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 28px;
      border: 2px solid var(--melody-border);
      box-shadow: 0 12px 35px rgba(255, 133, 162, 0.3);
      text-align: center;
      max-width: 320px;
      width: 85%;
      animation: popIntro 0.35s ease;
    }

    @keyframes popIntro {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .enter-icon {
      width: 55px;
      height: 55px;
      object-fit: contain;
      margin-bottom: 10px;
      animation: gentleBounce 1.5s infinite ease-in-out;
    }

    .enter-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--melody-pink);
      margin-bottom: 6px;
    }

    .enter-sub {
      font-size: 13px;
      color: var(--melody-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .enter-btn {
      width: 100%;
      background: linear-gradient(135deg, #ffb3c6, var(--melody-pink));
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 6px 16px rgba(255, 133, 162, 0.35);
      cursor: pointer;
    }

    /* ภาพมายเมโลดี้ลอยไปมา */
    .floating-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      bottom: -80px;
      width: 48px;
      height: 48px;
      object-fit: contain;
      pointer-events: none;
      animation: floatUp 12s linear infinite;
      opacity: 0.85;
      filter: drop-shadow(0 4px 8px rgba(255, 133, 162, 0.25));
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    /* สไตล์รูปมายเมโลดี้ที่โผล่มาตอนจิ้ม แล้วค่อยๆ จางหายไปแบบไว */
    .touch-pop-melody {
      position: fixed;
      width: 58px;
      height: 58px;
      object-fit: contain;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%) scale(0.6);
      animation: popAndFadeQuick 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      filter: drop-shadow(0 4px 10px rgba(255, 133, 162, 0.4));
    }

    @keyframes popAndFadeQuick {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
      }
      25% {
        opacity: 1;
        transform: translate(-50%, -60%) scale(1.1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -85%) scale(0.8);
      }
    }

    .wrapper {
      width: 100%;
      max-width: 390px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ส่วนหัวโปรไฟล์ */
    .header-card {
      background: var(--melody-card);
      backdrop-filter: blur(14px);
      border-radius: 30px;
      padding: 12px 12px 22px;
      text-align: center;
      border: 2px solid #ffffff;
      box-shadow: 0 10px 28px rgba(255, 133, 162, 0.2);
    }

    .banner-container {
      width: 100%;
      height: 145px;
      border-radius: 22px;
      overflow: hidden;
      background: #ffe6ec;
      border: 1.5px solid #ffffff;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-composite-wrap {
      position: relative;
      margin-top: -50px;
      display: inline-block;
      width: 100px;
      height: 100px;
    }

    .profile-img {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid #ffffff;
      box-shadow: 0 6px 18px rgba(255, 133, 162, 0.28);
      position: absolute;
      bottom: 0;
      left: 7px;
      background: #fff;
    }

    .profile-hat-frame {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 95px;
      height: auto;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1));
    }

    .store-title-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .store-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--melody-pink);
      letter-spacing: 0.4px;
    }

    .mini-melody-icon {
      width: 26px;
      height: 26px;
      object-fit: contain;
      animation: gentleBounce 2s infinite ease-in-out;
    }

    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .store-bio {
      font-size: 13px;
      color: var(--melody-muted);
      margin-top: 8px;
      line-height: 1.6;
      white-space: pre-line;
      padding: 0 10px;
    }

    .music-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      background: #ffffff;
      border: 1.5px solid var(--melody-border);
      color: var(--melody-pink);
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 179, 198, 0.3);
      transition: all 0.2s ease;
    }

    .music-btn:active {
      transform: scale(0.96);
    }

    /* รายการปุ่มลิงก์ */
    .links-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      background: var(--melody-card);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 15px 18px;
      border: 2px solid #ffffff;
      box-shadow: 0 6px 20px rgba(255, 133, 162, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--melody-text);
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .link-card:active {
      transform: scale(0.97);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-tag-icon {
      font-size: 18px;
    }

    .link-arrow {
      color: var(--melody-pink);
      font-size: 15px;
      font-weight: 700;
    }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: var(--melody-pink);
      font-weight: 600;
      margin-top: 14px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- แตะ 1 ครั้งตรงนี้เพื่อเริ่มเล่นเพลงทันที 100% -->
  <div class="enter-overlay" id="enterOverlay" onclick="enterSiteAndPlay()">
    <div class="enter-box">
      <img src="https://i.ibb.co/JFMdR2xf/IMG-3559.png" class="enter-icon" alt="My Melody">
      <div class="enter-title">inyourheartselris ♡</div>
      <div class="enter-sub">welcome to luvselris<br>click to watch</div>
      <button type="button" class="enter-btn">go to website ♡</button>
    </div>
  </div>

  <!-- ตัวเล่นเพลงพื้นหลัง -->
  <audio id="bgMusic" loop preload="auto" src="https://file.garden/asG8Gt-rqWIpi3II/%E0%B8%A2%E0%B8%B4%E0%B8%99%E0%B8%94%E0%B8%B5%20Ost.%E0%B8%A1%E0%B8%B2%E0%B8%95%E0%B8%B2%E0%B8%A5%E0%B8%94%E0%B8%B2%20sarah%20salola%20Official%20MV.mp3"></audio>

  <!-- เลเยอร์ภาพมายเมโลดี้ลอยไปมา -->
  <div class="floating-layer" id="floatContainer"></div>

  <div class="wrapper">
    <!-- Header ส่วนหัวร้านค้า -->
    <div class="header-card">
      <div class="banner-container">
        <!-- แบนเนอร์ gif -->
        <img id="bannerImg" src="https://c.tenor.com/qvn5EduVCSDAAAAC/tenor.gif" alt="Banner GIF" class="banner-img">
      </div>

      <div class="profile-composite-wrap">
        <!-- กรอบหัวมายเมโลดี้ -->
        <img id="headFrameImg" src="https://i.ibb.co/nqR30Rcw/IMG-3563.png" alt="Head Frame" class="profile-hat-frame">
        <!-- โปรไฟล์ -->
        <img id="profileImg" src="https://i.ibb.co/mCZ2x6pK/IMG-3558.jpg" alt="Profile" class="profile-img">
      </div>

      <div class="store-title-wrap">
        <h1 class="store-name" id="storeNameText">inyourheartselris</h1>
        <!-- ภาพมายเมโลดี้จิ๋วอยู่ข้างๆชื่อ -->
        <img id="miniMelodyIcon" src="https://i.ibb.co/JFMdR2xf/IMG-3559.png" alt="Melody Mini" class="mini-melody-icon">
      </div>

      <!-- กล่องคำอธิบายในกล่องเดียวกับโปรไฟล์ -->
      <div class="store-bio" id="storeBioText">welcome to luvselris ♡ 
ดูรีวิวกันก่อนได้นะคะ ตัวอย่างงานเว็บ งานป้าย คอนแทค 🪽</div>

      <button type="button" class="music-btn" id="musicToggleBtn" onclick="toggleMusic()">
        <span id="musicIcon">▶</span> <span id="musicText">play music !</span>
      </button>
    </div>

    <!-- รายการปุ่มลิงก์ทั้ง 3 ปุ่ม -->
    <div class="links-wrapper" id="linksList">
      <a href="https://lin.ee/OK18dvs" target="_blank" class="link-card" id="link1">
        <div class="link-left">
          <span class="link-tag-icon">♡</span>
          <span id="title1">contact me @861pblyp</span>
        </div>
        <span class="link-arrow">➔</span>
      </a>

      <a href="https://luvselris.web.app/#review" target="_blank" class="link-card" id="link2">
        <div class="link-left">
          <span class="link-tag-icon">♡</span>
          <span id="title2">review click</span>
        </div>
        <span class="link-arrow">➔</span>
      </a>

      <a href="https://drive.google.com/drive/folders/1VPUYkyqywBZgPIOjGnPbY2OpQn7BJwdq" target="_blank" class="link-card" id="link3">
        <div class="link-left">
          <span class="link-tag-icon">♡</span>
          <span id="title3">example เว็บ & ป้าย click</span>
        </div>
        <span class="link-arrow">➔</span>
      </a>
    </div>

    <div class="footer-text">thank you ♡</div>
  </div>

  <script>
    // 1. Firebase ดึงข้อมูลสดจากแอดมิน
    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("inyourheartselris_site").doc("config").onSnapshot(doc => {
      if (doc.exists) {
        const d = doc.data();
        if (d.storeName) document.getElementById("storeNameText").textContent = d.storeName;
        if (d.storeBio) document.getElementById("storeBioText").textContent = d.storeBio;
        if (d.bannerImg) document.getElementById("bannerImg").src = d.bannerImg;
        if (d.profileImg) document.getElementById("profileImg").src = d.profileImg;

        if (d.link1_title) document.getElementById("title1").textContent = d.link1_title;
        if (d.link1_url) document.getElementById("link1").href = d.link1_url;

        if (d.link2_title) document.getElementById("title2").textContent = d.link2_title;
        if (d.link2_url) document.getElementById("link2").href = d.link2_url;

        if (d.link3_title) document.getElementById("title3").textContent = d.link3_title;
        if (d.link3_url) document.getElementById("link3").href = d.link3_url;

        if (d.musicUrl && !music.src.endsWith(d.musicUrl)) {
          music.src = d.musicUrl;
          music.play().catch(() => {});
        }
      }
    });

    // 2. ระบบเพลงเล่นทันที
    const music = document.getElementById('bgMusic');
    const musicIcon = document.getElementById('musicIcon');
    const musicText = document.getElementById('musicText');

    function updateAudioStatus(isPlaying) {
      if (isPlaying) {
        musicIcon.textContent = "❚❚";
        musicText.textContent = "pause music";
      } else {
        musicIcon.textContent = "▶";
        musicText.textContent = "play music !";
      }
    }

    function enterSiteAndPlay() {
      document.getElementById('enterOverlay').classList.add('hidden');
      music.play().then(() => {
        updateAudioStatus(true);
      }).catch(err => {
        console.log("Play error:", err);
      });
    }

    function toggleMusic() {
      if (music.paused) {
        music.play().then(() => updateAudioStatus(true)).catch(() => {});
      } else {
        music.pause();
        updateAudioStatus(false);
      }
    }

    // 3. ภาพมายเมโลดี้ลอยไปมา
    const floatBox = document.getElementById("floatContainer");
    const floatingMelodyImg = "https://i.ibb.co/xN63n45/IMG-3564.png";

    function createFloatingMelody() {
      const el = document.createElement("img");
      el.src = floatingMelodyImg;
      el.className = "float-item";
      el.style.left = (Math.random() * 90) + "vw";
      el.style.animationDuration = (8 + Math.random() * 6) + "s";
      el.style.width = (40 + Math.random() * 20) + "px";
      floatBox.appendChild(el);
      setTimeout(() => { el.remove(); }, 14000);
    }
    setInterval(createFloatingMelody, 1600);

    // 4. จิ้มตรงไหน โผล่มาตรงนั้น แล้วค่อยๆ จางหายไปแบบไว
    const tapMelodyImgSrc = "https://i.ibb.co/XrFt9B5G/IMG-3566.png";

    function spawnMelodyPop(x, y) {
      const img = document.createElement("img");
      img.src = tapMelodyImgSrc;
      img.className = "touch-pop-melody";
      img.style.left = x + "px";
      img.style.top = y + "px";
      document.body.appendChild(img);

      // ลบออกจาก DOM ทันทีที่แอนิเมชันจางหายจบ (0.5 วินาที)
      setTimeout(() => {
        img.remove();
      }, 500);
    }

    // รองรับทั้งสัมผัสจอและคลิกเมาส์
    window.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      spawnMelodyPop(t.clientX, t.clientY);
    }, { passive: true });

    window.addEventListener("mousedown", (e) => {
      spawnMelodyPop(e.clientX, e.clientY);
    });
  </script>
</body>
</html>
